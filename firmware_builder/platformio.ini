; PlatformIO Configuration for Universal IoT Node Firmware
; Supports ESP8266 and ESP32 with AgyGatewayClient Library

[platformio]
default_envs = esp8266, esp32

[env:esp8266]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    -D AGY_UNIVERSAL_BUILD
lib_deps =
    symlink://..
    bblanchon/ArduinoJson @ ^7.0.4
    links2004/WebSockets @ ^2.4.1

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
monitor_speed = 115200
build_flags =
    -D AGY_UNIVERSAL_BUILD
lib_deps =
    symlink://..
    bblanchon/ArduinoJson @ ^7.0.4
    links2004/WebSockets @ ^2.4.1
